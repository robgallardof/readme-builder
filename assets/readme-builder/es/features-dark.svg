<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Primero el contenido: Escribe a partir del repositorio real. Conserva los comandos, los límites y los detalles que importan. · Un lenguaje visual: Iconos originales, secciones numeradas, banners y widgets reutilizables. SVG locales, bajo tu control. · Siempre tuyo: Sin servicio de render, clave de API ni paquetes en ejecución. Guarda los recursos en Git y listo."><title>Primero el contenido: Escribe a partir del repositorio real. Conserva los comandos, los límites y los detalles que importan. · Un lenguaje visual: Iconos originales, secciones numeradas, banners y widgets reutilizables. SVG locales, bajo tu control. · Siempre tuyo: Sin servicio de render, clave de API ni paquetes en ejecución. Guarda los recursos en Git y listo.</title><defs><linearGradient id="brand"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><g transform="translate(0 0)"><rect x="1" y="1" width="387" height="210" rx="16" fill="#141c30" stroke="#29334d"/><g transform="translate(24 24) scale(1.2)" fill="none" stroke="#8b5cf6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5v20h14V7Zm0 0v5h5M8 12h8m-8 4h6"/></g><text x="24" y="88" font-size="20" fill="#eef2ff" font-weight="700" >Primero el contenido</text><text x="24" y="120" font-size="15" fill="#a6b3ca" font-weight="400" >Escribe a partir del repositorio real.</text><text x="24" y="142" font-size="15" fill="#a6b3ca" font-weight="400" >Conserva los comandos, los límites y los</text><text x="24" y="164" font-size="15" fill="#a6b3ca" font-weight="400" >detalles que importan.</text></g><g transform="translate(405 0)"><rect x="1" y="1" width="387" height="210" rx="16" fill="#141c30" stroke="#29334d"/><g transform="translate(24 24) scale(1.2)" fill="none" stroke="#8b5cf6" stroke-width="1.7" stroke-line